# AradLens — nginx: static site + reverse-proxy /api către API-ul central.
# API-ul (https://api.aradlens.binarysquad.club, OpenAPI la /docs) nu publică
# anteturi CORS, deci browserul nu îl poate accesa direct; toate cererile
# din pagină pleacă din același origin pe /api/... și sunt relayate aici.
# Cererile autentificate trimit „Authorization: Bearer ..." care e relayat
# întocmai; proxy-ul nu stochează nimic despre sesiuni.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # /api/categories -> /categories (ultima bară taie prefixul /api)
    location /api/ {
        proxy_pass https://api.aradlens.binarysquad.club/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_set_header Host api.aradlens.binarysquad.club;
        proxy_pass_request_headers on;
        proxy_buffering off;
        proxy_read_timeout 30s;
        proxy_connect_timeout 15s;
    }

    # Un singur fișier de intrare; adresele necunoscute cad pe index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
